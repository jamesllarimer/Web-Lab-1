<nav class="navbar navbar-dark sticky-top">
    <div class="container-fluid">
        <a href="index.html" class="nav-link"> <img src="images/Logo.png" alt="Lefty's Appalachian Kitchen Logo" class="nav-logo"></a>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

<div class="container text-center">
<h1>Make a reservation</h1>
<p><i>* Reservation requests are request only and do not guarantee availability.</i></p>
    <form action="/reservation" method="post" id="reservationForm">
        <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" type="text" id="name" name="name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label class="form-label"  for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="example@domain.com">
        </div>
        <div class="form-group">
            <label class="form-label" for="party-size">Party Size</label>
            <input class="form-control" type="number" id="party-size" name="party-size">
        </div>
        <div class="form-group">
            <label class="form-label" for="date">Date</label>
            <input class="form-control" type="date" id="date" name="date">
        </div>
        <div class="form-group">
            <label class="form-label" for="time">Time</label>
            <input class="form-control" type="time" id="time" name="time">
        </div>
        <div class="form-group">
            <label class="form-label" for="dietary-notes">Dietary Notes</label>
            <textarea class="form-control" name="dietary-notes" id="dietary-notes" placeholder="Dietary preferences..."></textarea>
        </div>
        <div class="radio-group">
        <fieldset aria-required="true">
            <legend>Seating Preference</legend>
            <div class="form-check form-check-inline">
                <input class="form-check-input"  type="radio" id="indoor" name="seating-preference" value="Indoor" >
                <label class="form-check-label"  for="indoor">Indoor</label>
            </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input"  type="radio" id="outdoor" name="seating-preference" value="Outdoor">
                    <label class="form-check-label"  for="outdoor">Outdoor</label>
                </div>
                    <div class="form-check form-check-inline">
                <input class="form-check-input"  type="radio" name="seating-preference" id="bar">
                <label class="form-check-label"  for="bar" value="Bar">Bar</label>
                    </div>

        </fieldset>
        </div>
    <fieldset>
        <legend>Sign up for our newsletter</legend>
            <div class="form-check form-check-inline">
                <input class="form-check-input"  type="radio" name="newsletter" id="yes" value="yes">
                <label class="form-check-label"  for="yes">Yes</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input"  type="radio" name="newsletter" id="no" value="no" checked>
                <label class="form-check-label"  for="no">No</label>
            </div>
    </fieldset>
        <button class="btn btn-lg btn-light" type="submit">Submit</button>
        <button class="btn  btn-lg btn-dark" type="reset">Reset</button>
    </form>
    <div id="alert-section">

    </div>
    <div id="form_result">

    </div>
</div>
<script src="./JavaScript/FirstDemo/script.js"></script>
</body>
</html>
